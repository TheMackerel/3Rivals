name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # La cintura parla con user32, kernel32 e winmm: si prova su Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --workspace --locked
